name: Garmin dashboard

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub can delay a run by a few minutes)
  workflow_dispatch:         # "Run workflow" button for a manual refresh

permissions:
  contents: read

concurrency:
  group: garmin-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore saved history (encrypted cache)
        uses: actions/cache@v4
        with:
          path: cache
          key: history-${{ github.run_id }}
          restore-keys: |
            history-

      - name: Unpack history
        run: |
          mkdir -p cache
          if [ -f cache/data.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:GARMIN_PERSONAL_API_KEY -in cache/data.enc | tar xz || rm -rf data
          fi

      - name: Pull Garmin data (read-only, only new days)
        run: python pull.py --days 365

      - name: Decide whether to publish
        id: chg
        run: |
          NEW=$(find data -type f ! -name '_meta.json' | sort | xargs sha256sum | sha256sum | cut -d' ' -f1)
          OLD=$(cat cache/last.hash 2>/dev/null || echo none)
          NOW=$(date +%s)
          LAST=$(cat cache/last.time 2>/dev/null || echo 0)
          if [ "$NEW" != "$OLD" ] || [ $((NOW-LAST)) -gt 21600 ]; then
            echo "publish=yes" >> "$GITHUB_OUTPUT"
            echo "$NEW" > cache/last.hash
            echo "$NOW" > cache/last.time
          else
            echo "publish=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Save history (encrypted)
        run: tar cz data | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:GARMIN_PERSONAL_API_KEY -out cache/data.enc

      - name: Build dashboard
        if: steps.chg.outputs.publish == 'yes'
        run: |
          python build.py
          mkdir -p dist
          cp dashboard.html dist/index.html
          printf '/*\n  X-Robots-Tag: noindex, nofollow\n  Cache-Control: no-store\n' > dist/_headers

      - name: Publish to Cloudflare Pages
        if: steps.chg.outputs.publish == 'yes'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=garmin-dashboard --branch=main
